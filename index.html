<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SHOT Digital Profile</title>
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet">
    <!-- Styles -->
    <link rel="stylesheet" href="./styles.css">
    <!-- Firebase SDKs -->
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>
</head>
<body>
    <div id="app">
        <!-- Loading State -->
        <div id="loading-state" class="state-container">
            <div class="spinner"></div>
            <p class="state-text">جاري تحميل البروفايل...</p>
        </div>

        <!-- Error State -->
        <div id="error-state" class="state-container hidden">
            <div class="error-icon">⚠️</div>
            <h2 id="error-title" class="state-title">خطأ</h2>
            <p id="error-message" class="state-text">تعذر تحميل البروفايل.</p>
        </div>

        <!-- Profile Content Container -->
        <div id="profile-container" class="profile-container hidden">
            <!-- Cover Header -->
            <div id="cover-section" class="cover-section">
                <div id="cover-gradient" class="cover-gradient"></div>
                <img id="cover-image" class="cover-image hidden" alt="Cover Image">
            </div>

            <!-- Profile Header -->
            <div class="profile-header">
                <div class="avatar-wrapper">
                    <img id="profile-photo" class="profile-photo hidden" alt="Profile Photo">
                    <div id="avatar-placeholder" class="avatar-placeholder">
                        <span id="avatar-initials"></span>
                    </div>
                </div>

                <div class="profile-info">
                    <h1 id="profile-name" class="profile-name"></h1>
                    <p id="profile-tagline" class="profile-tagline hidden"></p>
                    
                    <div id="profile-role-company" class="profile-role-company hidden">
                        <span id="profile-role" class="role-badge hidden"></span>
                        <span id="profile-company-separator" class="separator hidden">•</span>
                        <span id="profile-company" class="company-text hidden"></span>
                    </div>
                </div>

                <!-- Primary Action Buttons -->
                <div id="primary-actions" class="primary-actions">
                    <button id="save-vcard-btn" class="btn btn-primary hidden">
                        <svg class="btn-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"></path>
                            <polyline points="17 21 17 13 7 13 7 21"></polyline>
                            <polyline points="7 3 7 8 15 8"></polyline>
                        </svg>
                        <span>حفظ جهة الاتصال</span>
                    </button>

                    <button id="share-btn" class="btn btn-secondary">
                        <svg class="btn-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <circle cx="18" cy="5" r="3"></circle>
                            <circle cx="6" cy="12" r="3"></circle>
                            <circle cx="18" cy="19" r="3"></circle>
                            <line x1="8.59" y1="13.51" x2="15.42" y2="17.49"></line>
                            <line x1="15.41" y1="6.51" x2="8.59" y2="10.49"></line>
                        </svg>
                        <span>مشاركة</span>
                    </button>
                </div>
            </div>

            <!-- Profile Sections -->
            <div class="profile-body">
                <!-- Contact Info Section -->
                <section id="contact-section" class="section hidden">
                    <h2 class="section-title">معلومات الاتصال</h2>
                    <div id="contact-grid" class="contact-grid"></div>
                </section>

                <!-- Custom Links Section -->
                <section id="links-section" class="section hidden">
                    <h2 class="section-title">الروابط الإلكترونية</h2>
                    <div id="links-list" class="links-list"></div>
                </section>

                <!-- Gallery Section -->
                <section id="gallery-section" class="section hidden">
                    <h2 class="section-title">معرض الصور</h2>
                    <div id="gallery-grid" class="gallery-grid"></div>
                </section>
            </div>

            <!-- Footer -->
            <footer class="profile-footer">
                <p>Powered by <strong>SHOT</strong> | Lello 3D</p>
            </footer>
        </div>
    </div>

    <!-- Image Lightbox Modal -->
    <div id="lightbox" class="lightbox hidden">
        <span id="lightbox-close" class="lightbox-close">&times;</span>
        <img id="lightbox-img" class="lightbox-content" alt="Enlarged Image">
        <div id="lightbox-caption" class="lightbox-caption"></div>
    </div>

    <!-- Toast Notification -->
    <div id="toast" class="toast hidden"></div>

    <script src="./app.js"></script>
</body>
</html>
